<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 320x50 host document for the Infolinks in-place unit. Loaded via
         iframe src so Infolinks sees a real document URL (not about:srcdoc). -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 320px;
        height: 50px;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript">
      window.infolinks_config = {
        pid: 3446242,
        iframe: true,
        inplace_slot: {
          width: 320,
          height: 50,
          plugin_version: "Genuin",
          keepFrame: true,
        },
      };
    </script>
    <script type="text/javascript" src="https://resources.infolinks.com/js/infolinks_main.js"></script>
  </head>
  <body></body>
</html>
