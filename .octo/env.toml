# Octo injects env at the REPO ROOT and it propagates to the whole tree,
# including apps/webapp. There is NO per-subfolder env — this single file at the
# repo root covers both the root app and apps/webapp.
#
# RULES (enforced by Octo):
#   - This file stores ONLY *references* to AWS Secrets Manager, never secret
#     values. It is therefore SAFE TO COMMIT.
#   - The only accepted keys are a top-level `AWS_REGION` and one or more
#     [[aws_secret]] tables. Plain KEY = "value" pairs here are IGNORED.
#   - `export` MUST be the literal string "json". No other value is valid.
#   - The referenced secret's value must be a JSON OBJECT of string values;
#     each JSON key becomes one env var. Keys must be valid shell identifiers.
#

# Default region the secrets live in. CONFIRM before first deploy.
AWS_REGION = "us-east-1"

# Two secrets, one per env source. Octo MERGES both into one flat env for the
# whole repo (root + apps/webapp) — this split is organizational only, it does
# NOT isolate apps/webapp's env. On a key collision the LATER block wins, so the
# webapp secret is listed second to override shared values.

# 1) Shared / root env (from /.env)
[[aws_secret]]
secret_id = "begenuin/qa/webapp/shared-env"
export    = "json"

# 2) Webapp env (from apps/webapp/.env.local) — overrides the shared secret on collision
[[aws_secret]]
secret_id = "begenuin/qa/webapp/webapp-env"
export    = "json"
