name: E2E Tests — Webapp

on:
  workflow_dispatch:
  pull_request:
    types: [opened, labeled]

concurrency:
  group: e2e-webapp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'run-e2e-all') &&
       (contains(github.event.pull_request.labels.*.name, 'app:webapp') ||
        contains(github.event.pull_request.labels.*.name, 'pkg:ui') ||
        contains(github.event.pull_request.labels.*.name, 'pkg:components') ||
        contains(github.event.pull_request.labels.*.name, 'pkg:utils')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Create webapp env file
        run: echo "${{ secrets.WEBAPP_ENV }}" > .env

      - name: Install Playwright system dependencies
        run: pnpm --filter webapp exec playwright install-deps chromium

      - name: Build webapp
        run: pnpm --filter webapp build

      - name: Run E2E tests
        run: pnpm --filter webapp test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-playwright-report
          path: apps/webapp/tests/playwright-report/
          retention-days: 7
